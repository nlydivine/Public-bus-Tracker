<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigali Bus Tracker - Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; }
  #map { height: 100vh; width: 100%; }
  #locate-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 1000;
    padding: 10px 16px;
    background: #00a8ff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  #locate-btn:hover { background: #0077b6; }
</style>
</head>
<body>

<div id="map"></div>
<button id="locate-btn" onclick="getUserLocation()">📍 Find Me</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/map.js"></script>
<script src="js/gps.js"></script>
<script src="js/stops.js"></script>
</body>
</html>
