<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kigali Bus Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Kigali Bus Tracker</h1>
    <nav>
      <button id="tab-map" class="tab active">Live map</button>
      <button id="tab-plan" class="tab">Plan a trip</button>
    </nav>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
    </section>

    <section id="view-plan" class="view">
      <form id="trip-form">
        <label>
          From
          <select id="origin-stop"></select>
        </label>
        <label>
          To
          <select id="destination-stop"></select>
        </label>
        <label>
          Depart in (minutes from now)
          <input type="number" id="depart-minutes" value="0" min="0" max="180" />
        </label>
        <button type="submit">Find buses</button>
      </form>
      <ul id="trip-results"></ul>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
